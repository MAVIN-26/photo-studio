<fieldset class="booking-selection">
  <legend class="booking-heading">Дата</legend>
  <div class="booking-dates" aria-label="Дата съёмки"></div>
  <p class="booking-help">Бронировать можно на 30 дней вперёд.</p>
  <div class="booking-time-heading"><h2>Время</h2><span class="booking-date-label"></span></div>
  <ul class="booking-legend">
    <li>Свободно</li><li>Выбрано</li><li>Занято</li><li>Прошло</li>
  </ul>
  <div class="booking-slots" aria-label="Время съёмки"></div>
  <button class="text-button booking-retry" type="button" hidden>Обновить время</button>
  <p class="booking-help">{{ grid_hint }}</p>
</fieldset>
